# Actualizaciones automáticas de dependencias: GitHub abre un pull request y el CI lo prueba
# antes de que lo aceptes. Las versiones menores y los parches vienen juntos para no llenar
# el repositorio de avisos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
