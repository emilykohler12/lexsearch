name: CI

# Corre en cada push a main y en cada pull request: si algo se rompe, se ve acá
# antes de que llegue a main. Cuando todo pasa en main, además se construyen y se
# publican las imágenes de Docker (CD).
on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la corrida anterior de la misma rama, salvo en main: ahí
# no se interrumpe una publicación a la mitad (la siguiente espera su turno).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Revisar, compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # La misma base que usa el proyecto en tu computadora: PostgreSQL 17 con pgvector.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lexsearch
          POSTGRES_PASSWORD: lexsearch_dev
          POSTGRES_DB: lexsearch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexsearch -d lexsearch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Datos de desarrollo del .env.example: no son secretos. La clave de Gemini no se usa:
      # los tests usan un modelo de IA simulado.
      DATABASE_URL: postgresql://lexsearch:lexsearch_dev@localhost:5432/lexsearch
      TEST_DATABASE_URL: postgresql://lexsearch:lexsearch_dev@localhost:5432/lexsearch_test

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # También genera el cliente de Prisma (postinstall del backend).
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      - name: Crear la base de pruebas
        run: PGPASSWORD=lexsearch_dev psql -h localhost -U lexsearch -d lexsearch -c "CREATE DATABASE lexsearch_test;"

      - name: Tests (unitarios y de integración)
        run: npm test

      # Las migraciones se escriben a mano: esto avisa si schema.prisma y las migraciones se desfasan.
      - name: El esquema coincide con las migraciones
        working-directory: backend
        env:
          DATABASE_URL: postgresql://lexsearch:lexsearch_dev@localhost:5432/lexsearch_test
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  # Solo cuando algo llega a main y el trabajo anterior pasó: construye las dos imágenes de
  # Docker, prueba que el sistema completo arranca con ellas (base + API + web, como lo
  # levantaría docker-compose.prod.yml) y recién entonces las publica en ghcr.io.
  publicar:
    name: Construir y publicar las imágenes
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    env:
      # Contraseña de la base descartable de la prueba (se borra al terminar).
      POSTGRES_PASSWORD: prueba
      # Usuario de la prueba (la contraseña es «clave de prueba del ci 2026»): solo existe en este trabajo.
      AUTH_USERNAME: ci
      AUTH_PASSWORD_HASH: "scrypt:32768:8:1:pPFqhA2pI9FsFzSdWx17hA:ESNZRhJX7J9kqyyh8YpxGiCxQmdXmRG-8TFUg8oHYt8"
      # Puertos del HTTPS de la prueba y carpeta de las copias de seguridad.
      HTTPS_PORT: "8443"
      HTTP_PORT: "8081"
      BACKUP_DIR: ./backups

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # ghcr.io exige nombres en minúsculas. Cada imagen queda con dos etiquetas: latest y la
      # del commit (sha-1234567), para poder volver a una versión anterior.
      - name: Nombres de las imágenes
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA::7}"
          {
            echo "API_REPO=ghcr.io/${repo}-api"
            echo "WEB_REPO=ghcr.io/${repo}-web"
            echo "API_IMAGE=ghcr.io/${repo}-api:${version}"
            echo "WEB_IMAGE=ghcr.io/${repo}-web:${version}"
          } >> "$GITHUB_ENV"

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir la imagen de la API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: |
            ${{ env.API_REPO }}:latest
            ${{ env.API_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Construir la imagen de la web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: |
            ${{ env.WEB_REPO }}:latest
            ${{ env.WEB_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Se levanta todo junto con las imágenes recién construidas (API_IMAGE y WEB_IMAGE) y se
      # espera a que la base y la API digan que están sanas.
      # La clave con la que se abren las copias de seguridad de la prueba: la pública va al sistema, la privada
      # queda acá para comprobar que la copia se puede abrir.
      - name: Crear la clave de las copias de seguridad
        run: |
          docker run --rm alpine sh -c 'apk add -q age > /dev/null && age-keygen' > backup-key.txt 2> /dev/null
          echo "BACKUP_AGE_RECIPIENT=$(grep -o 'age1[a-z0-9]*' backup-key.txt | head -1)" >> "$GITHUB_ENV"
          mkdir -p backups

      - name: Probar el sistema completo con las imágenes
        run: |
          docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 240
          web=https://localhost:8443
          # La interfaz responde por HTTPS (con el certificado propio de Caddy), también en las rutas que resuelve React.
          curl -fsSk "$web/" | grep 'id="root"' > /dev/null
          curl -fsSk "$web/plazos" | grep 'id="root"' > /dev/null
          # El puerto sin cifrar redirige al HTTPS.
          curl -sI http://localhost:8081/ | grep -i '^location: https://' > /dev/null
          # La API responde a través de Caddy y nginx, la base está conectada y las migraciones se aplicaron.
          curl -fsSk "$web/api/health" | grep '"database":"ok"' > /dev/null
          # Sin iniciar sesión no se ve nada; con la contraseña equivocada tampoco.
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$web/api/clients")" = 401
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST "$web/api/auth/login" -H 'content-type: application/json' -d '{"username":"ci","password":"incorrecta incorrecta"}')" = 401
          curl -fsSk -c jar -X POST "$web/api/auth/login" -H 'content-type: application/json' -d '{"username":"ci","password":"clave de prueba del ci 2026"}' | grep '"authenticated":true' > /dev/null
          # La cookie de sesión no la puede leer una página (HttpOnly) y viaja solo por HTTPS.
          grep '#HttpOnly_' jar | grep -i 'TRUE' > /dev/null
          curl -fsSk -b jar -o /dev/null "$web/api/clients"
          curl -fsSk -b jar -o /dev/null "$web/api/deadlines"
          curl -fsSk -b jar -o /dev/null "$web/api/cases"
          curl -fsSk -b jar -o /dev/null "$web/api/notifications"
          curl -fsSk -b jar -o /dev/null "$web/api/normativa/status"
          curl -fsSk -b jar -o /dev/null "$web/api/hearings"
          # El usuario sin privilegios de la API puede guardar archivos en la carpeta de documentos.
          curl -fsSk -b jar -X POST "$web/api/documents" -F category=OTRO -F "files=@README.md;type=text/markdown" | grep '"status":"created"' > /dev/null
          # Cerrar la sesión la invalida.
          curl -fsSk -b jar -X POST -o /dev/null "$web/api/auth/logout"
          test "$(curl -sk -b jar -o /dev/null -w '%{http_code}' "$web/api/clients")" = 401

      # La primera copia se hace al arrancar. Se abre con la clave privada y trae la base y los archivos.
      - name: Probar las copias de seguridad
        run: |
          for i in $(seq 1 40); do ls backups/lexsearch-*.tar > /dev/null 2>&1 && break; sleep 3; done
          ls -l backups/
          # El archivo trae las dos partes cifradas; con la clave privada se abren: la base es un volcado de PostgreSQL
          # (empieza con «PGDMP») y los documentos un tar.
          docker run --rm -v "$PWD:/w" alpine sh -c '
            apk add -q age tar > /dev/null && mkdir -p /w/abierta && cd /w/abierta &&
            tar -xf /w/backups/lexsearch-*.tar && ls &&
            age -d -i /w/backup-key.txt -o db.dump db.dump.age && head -c 5 db.dump | grep -x PGDMP &&
            age -d -i /w/backup-key.txt storage.tar.age | tar -t'
          # Nada queda sin cifrar en la carpeta de las copias.
          test -z "$(find backups -type f ! -name 'lexsearch-*.tar')"

      - name: Registros del sistema (si la prueba falló)
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 200

      - name: Apagar la prueba
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

      - name: Publicar las imágenes
        run: |
          docker push --all-tags "$API_REPO"
          docker push --all-tags "$WEB_REPO"
          {
            echo "### Imágenes publicadas"
            echo
            echo "- \`${API_IMAGE}\`"
            echo "- \`${WEB_IMAGE}\`"
            echo
            echo "Las mismas quedan también con la etiqueta \`latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
