server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Documentos de hasta 50 MB (el máximo de la API, MAX_UPLOAD_MB).
  client_max_body_size 60m;

  # La API se resuelve recién cuando llega un pedido (resolver de Docker): así nginx arranca
  # aunque el servicio "api" todavía no esté levantado.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api http://api:4000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Redactar un borrador o leer una cédula con IA puede tardar un par de minutos.
    proxy_read_timeout 180s;
  }

  # Los archivos con hash en el nombre no cambian: el navegador puede guardarlos mucho tiempo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # El index.html referencia esos archivos: tiene que revisarse siempre para ver las versiones nuevas.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Las páginas de la app (/plazos, /clientes/…) las resuelve React en el navegador.
  location / {
    try_files $uri /index.html;
  }
}
